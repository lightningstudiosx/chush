<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chush</title>
<style>
  :root {
    --bg: #ffffff; --fg: #111111; --dim: #999999; --glow: #c9a400;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0d0d0d; --fg: #eaeaea; --dim: #666666; --glow: #ffd84d; }
  }
  :root[data-theme="dark"] { --bg: #0d0d0d; --fg: #eaeaea; --dim: #666666; --glow: #ffd84d; }
  * { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: Georgia, "Times New Roman", serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  #root { padding: 24px; max-width: 40em; }
  .glyph { font-size: clamp(6rem, 30vw, 14rem); line-height: 1; user-select: none; }
  .duck { font-size: clamp(4rem, 20vw, 8rem); line-height: 1.1; user-select: none; }
  .small { font-size: 1.05rem; line-height: 1.7; }
  .dim { color: var(--dim); font-size: .85rem; }
  .mono { font-family: "Courier New", monospace; }
  .para { font-size: 1.05rem; line-height: 2; text-align: left; margin-top: 2em; }
  /* the hidden letters: same size, same color, slightly different typeface */
  .para .k { font-family: "Trebuchet MS", Verdana, sans-serif; font-size: .96em; }
  .para .k:hover, .para .k:active { color: var(--glow); text-shadow: 0 0 8px var(--glow); }
  .find { font-size: 1.6rem; letter-spacing: .3em; }
  form.answer { margin-top: 2.2em; }
  form.answer input {
    font-family: inherit; font-size: 1rem; text-align: center;
    background: transparent; color: var(--fg);
    border: none; border-bottom: 1px solid var(--dim);
    padding: 6px 10px; outline: none; width: 12em; max-width: 70vw;
  }
  form.answer input:focus { border-bottom-color: var(--fg); }
  form.answer button {
    font-family: inherit; font-size: 1rem; background: none; color: var(--dim);
    border: none; cursor: pointer; padding: 6px 10px;
  }
  form.answer button:hover { color: var(--fg); }
  .no { margin-top: 1em; color: var(--dim); font-size: .85rem; min-height: 1.2em; }
  .pond { font-size: clamp(3rem, 14vw, 5rem); user-select: none; }
  .castbtn {
    font-family: inherit; font-size: 1.05rem; margin-top: 1.6em;
    background: none; color: var(--fg); border: 1px solid var(--dim);
    border-radius: 4px; padding: 8px 26px; cursor: pointer;
  }
  .castbtn:hover { border-color: var(--fg); }
  .castbtn:disabled { color: var(--dim); cursor: wait; }
  .catchline { margin-top: 1.6em; min-height: 2.4em; font-size: 1.05rem; line-height: 1.7; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // ==========================================================================
  // chush — a url puzzle game.
  // GitHub Pages serves this 404.html for every path that isn't a real file,
  // so this file IS the game: it looks at the URL and renders that level.
  // ==========================================================================

  const norm = s => s.toLowerCase().replace(/\s+/g, "");

  // answers for the deep quest are hashed. reading the source won't save you.
  function fnv(s) {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h >>> 0;
  }

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // ---- level 2: the duck --------------------------------------------------
  const DUCK_LEVEL_HTML =
    '<!-- TODO: remove legacy duck registration code before launch -->' +
    '<div id="duck-registry" hidden aria-hidden="true"' +
    ' data-species="mallard" data-color="classic" data-name="jimmybob"' +
    ' data-registered="true" data-schema-version="3"></div>' +
    '<!-- deprecated: window.duck = registry.lookup("jimmybob") // old api -->' +
    '<div class="duck">&#129414;</div>' +
    '<p class="small">this is a duck. name him.</p>';

  // ---- level 3: find ------------------------------------------------------
  const FIND_PARAGRAPH =
    "somewhere in this pond there is a number. the duck knows it, but he " +
    "is not telling. he just floats, watching the water, waiting for " +
    "someone patient enough to look closer at things. maybe he is right " +
    "to wait and watch his own reflection.";
  const HIDDEN_SEQUENCE = "onefoureighttwo";

  function buildFindHTML() {
    let k = 0, out = "";
    for (const ch of FIND_PARAGRAPH) {
      if (k < HIDDEN_SEQUENCE.length && ch.toLowerCase() === HIDDEN_SEQUENCE[k]) {
        out += '<span class="k">' + ch + '</span>';
        k++;
      } else {
        out += ch;
      }
    }
    return '<div class="find">find</div><p class="para">' + out + '</p>';
  }

  // ---- level 4: the pond, the fish, the deep quest ------------------------
  const CATCHES = [
    "&#128031; a fish.",
    "&#128031; another fish.",
    "&#129406; an old boot.",
    "&#128031; a suspiciously normal fish.",
    "&#129693; nothing. the worm is gone.",
    "&#128032; a slightly colorful fish. not crazy though.",
    "&#127807; a clump of weeds.",
    "&#128031; a fish that looks disappointed in you.",
  ];

  const QUEST = [
    { q: 'the crazy fish whispers:<br><span class="mono">eW5hZ3JlYXN2ZnU=</span>' +
         '<br><span class="dim">he speaks in two tongues. decode both.</span>',
      h: 126588261 },
    { q: 'the crazy fish asks:<br>multiply the eyes of a box jellyfish by the ' +
         'hearts of an octopus, then add the legs that make a lobster a decapod.',
      h: 2416027439 },
    { q: 'the crazy fish taps his tail:<br><span class="mono">-..- ... ..-. .... ...</span>' +
         '<br><span class="dim">decode the taps, then hold them up to a mirror ' +
         'of the alphabet.</span>',
      h: 2177235738 },
  ];

  function answerForm(root, onSubmit) {
    const form = document.createElement("form");
    form.className = "answer";
    form.innerHTML = '<input autocomplete="off" spellcheck="false" ' +
                     'aria-label="answer"><button type="submit">&#8594;</button>' +
                     '<div class="no"></div>';
    root.appendChild(form);
    const input = form.querySelector("input");
    const no = form.querySelector(".no");
    form.addEventListener("submit", e => {
      e.preventDefault();
      onSubmit(input.value, () => {
        no.textContent = "no.";
        input.value = "";
        setTimeout(() => { no.textContent = ""; }, 1500);
      });
    });
    input.focus();
    return form;
  }

  function showQuest(root, qi) {
    root.innerHTML = '<div class="small">' + QUEST[qi].q + '</div>' +
                     '<div class="dim" style="margin-top:1.5em">' +
                     (qi + 1) + ' / ' + QUEST.length + '</div>';
    answerForm(root, (value, wrong) => {
      if (fnv(norm(value)) === QUEST[qi].h) {
        const next = qi + 1;
        store.set("chushQ", String(next));
        if (next >= QUEST.length) {
          root.innerHTML =
            '<div class="small">the crazy fish nods slowly.<br><br>' +
            'you answered the unanswerable.<br><br>' +
            '<span class="dim">level 5 is being built. ' +
            'few will ever read this sentence.</span></div>';
        } else {
          showQuest(root, next);
        }
      } else {
        wrong();
      }
    });
  }

  function setupFishing(root) {
    // already caught the crazy fish before? resume the quest.
    if (store.get("chushCrazy") === "1") {
      const qi = Math.min(parseInt(store.get("chushQ") || "0", 10), QUEST.length - 1);
      if (parseInt(store.get("chushQ") || "0", 10) >= QUEST.length) {
        root.innerHTML = '<div class="small dim">the pond is quiet now. ' +
                         'you already answered the unanswerable.</div>';
      } else {
        showQuest(root, qi);
      }
      return;
    }

    root.innerHTML =
      '<div class="pond">&#127754;</div>' +
      '<p class="small">a pond. quiet. probably nothing in it.</p>' +
      '<button class="castbtn" id="cast">cast</button>' +
      '<div class="catchline" id="line"></div>' +
      '<div class="dim" id="count"></div>';
    const btn = document.getElementById("cast");
    const line = document.getElementById("line");
    const count = document.getElementById("count");
    let casts = 0;

    btn.addEventListener("click", () => {
      btn.disabled = true;
      line.innerHTML = '<span class="dim">...</span>';
      setTimeout(() => {
        casts++;
        count.textContent = "cast " + casts;
        if (Math.random() < 0.01) {
          store.set("chushCrazy", "1");
          store.set("chushQ", "0");
          line.innerHTML = '&#128032;&#10024; <b>THE CRAZY FISH.</b><br>' +
                           '<span class="dim">he looks at you. he has questions.</span>';
          setTimeout(() => showQuest(root, 0), 2200);
        } else {
          line.innerHTML = CATCHES[Math.floor(Math.random() * CATCHES.length)];
          btn.disabled = false;
        }
      }, 800 + Math.random() * 1600);
    });
  }

  // ---- levels -------------------------------------------------------------
  const LEVELS = {
    "!": {
      title: "chush - !",
      html: '<div class="glyph">@</div>'
    },
    "@": {
      title: "chush - name him",
      html: DUCK_LEVEL_HTML,
      answer: ["jimmybob"],
      next: "jimmybob"
    },
    "jimmybob": {
      title: "chush - find",
      html: buildFindHTML(),
      answer: ["1482", "onefoureighttwo"],
      next: "1482"
    },
    "1482": {
      title: "chush - fish",
      html: "",
      setup: setupFishing
    },
  };

  const WRONG = {
    title: "chush",
    html: '<div class="small dim">there is nothing here.</div>'
  };

  // ---- engine -------------------------------------------------------------
  let path = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, "");
  const level = LEVELS[path] || WRONG;
  document.title = level.title;
  const root = document.getElementById("root");
  root.innerHTML = level.html;

  if (level.answer) {
    answerForm(root, (value, wrong) => {
      if (level.answer.includes(norm(value))) {
        location.href = "/" + level.next;
      } else {
        wrong();
      }
    });
  }
  if (level.setup) level.setup(root);
</script>
</body>
</html>
